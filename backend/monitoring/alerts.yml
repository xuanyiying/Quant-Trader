# ============================================================
# Prometheus 告警规则配置
# ============================================================

groups:
  - name: quant-trader-alerts
    rules:
      # ==================== 服务可用性告警 ====================
      
      # 服务宕机告警
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 宕机"
          description: "{{ $labels.instance }} 已经宕机超过 1 分钟"

      # ==================== 性能告警 ====================
      
      # 高延迟告警
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API 延迟过高"
          description: "95% 请求延迟超过 1s，当前值: {{ $value }}s"

      # 高错误率告警
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "错误率过高"
          description: "5xx 错误率超过 5%，当前值: {{ $value | humanizePercentage }}"

      # ==================== 数据库告警 ====================
      
      # 数据库连接数告警
      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接数过高"
          description: "当前连接数: {{ $value }}"

      # 数据库慢查询告警
      - alert: DatabaseSlowQueries
        expr: rate(pg_stat_statements_total_time_seconds[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库慢查询"
          description: "检测到慢查询，请检查 SQL 语句"

      # ==================== 撮合引擎告警 ====================
      
      # 撮合引擎延迟告警
      - alert: MatchingEngineHighLatency
        expr: histogram_quantile(0.99, matching_engine_latency_seconds_bucket) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "撮合引擎延迟过高"
          description: "99% 撮合延迟超过 100ms，当前值: {{ $value }}s"

      # 订单簿深度告警
      - alert: OrderBookDepthLow
        expr: orderbook_depth < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "订单簿深度过低"
          description: "{{ $labels.symbol }} 订单簿深度低于 10"

      # ==================== 内存告警 ====================
      
      # 内存使用率告警
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率过高"
          description: "内存使用率超过 85%，当前值: {{ $value | humanizePercentage }}"

      # Goroutine 数量告警
      - alert: TooManyGoroutines
        expr: go_goroutines > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Goroutine 数量过多"
          description: "当前 Goroutine 数量: {{ $value }}"

      # ==================== NATS 告警 ====================
      
      # NATS 连接数告警
      - alert: NatsConnectionsHigh
        expr: gnatsd_varz_connections > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NATS 连接数过高"
          description: "当前连接数: {{ $value }}"

      # NATS 消息积压告警
      - alert: NatsMessagesPending
        expr: gnatsd_stream_pending_messages > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NATS 消息积压"
          description: "待处理消息数: {{ $value }}"

      # ==================== Redis 告警 ====================
      
      # Redis 内存告警
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存使用率过高"
          description: "内存使用率: {{ $value | humanizePercentage }}"

      # Redis 连接数告警
      - alert: RedisConnectionsHigh
        expr: redis_connected_clients > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 连接数过高"
          description: "当前连接数: {{ $value }}"
